<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lily's Plinko Badge</title>
  <meta name="description" content="Lily Ferreira, Assistant Infrastructure Manager (Black Team Assistant Lead), Horse Plinko Cyber Challenge 4">
  <meta property="og:title" content="Lily's Plinko Badge">
  <meta property="og:description" content="Assistant Infrastructure Manager, HPCC4 Black Team">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://badge.blckbrd.dev/">
  <meta property="og:image" content="https://badge.blckbrd.dev/public/pfp-384.png">
  <link rel="canonical" href="https://badge.blckbrd.dev/">
  <meta name="theme-color" content="#5BCEFA">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="public/plink-logo.svg" type="image/svg+xml">
  <link rel="preload" href="public/fonts/metropolis-bold.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="public/fonts/metropolis-extrabold.otf" as="font" type="font/otf" crossorigin>
  <style>
    @font-face { font-family: Metropolis; font-weight: 400; font-style: normal; font-display: swap; src: url("public/fonts/metropolis-regular.otf") format("opentype"); }
    @font-face { font-family: Metropolis; font-weight: 400; font-style: italic; font-display: swap; src: url("public/fonts/metropolis-regularitalic.otf") format("opentype"); }
    @font-face { font-family: Metropolis; font-weight: 700; font-style: normal; font-display: swap; src: url("public/fonts/metropolis-bold.otf") format("opentype"); }
    @font-face { font-family: Metropolis; font-weight: 800; font-style: normal; font-display: swap; src: url("public/fonts/metropolis-extrabold.otf") format("opentype"); }
    @font-face { font-family: Metropolis; font-weight: 100; font-style: italic; font-display: swap; src: url("public/fonts/metropolis-thinitalic.otf") format("opentype"); }

    :root {
      --flag-blue: #5BCEFA;
      --flag-white: #FFFFFF;
      --flag-pink: #F5A9B8;
      --ink: #1A1A1A;
      --pronoun: #DF55DF;
      --font: Metropolis, "Helvetica Neue", Arial, system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--flag-pink); -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      font-family: var(--font);
      color: var(--ink);
      background: linear-gradient(to bottom, var(--flag-blue) 0%, var(--flag-white) 50%, var(--flag-pink) 75%);
      padding:
        max(env(safe-area-inset-top), clamp(1rem, 3svh, 2rem))
        max(env(safe-area-inset-right), 1.25rem)
        max(env(safe-area-inset-bottom), 0.5rem)
        max(env(safe-area-inset-left), 1.25rem);
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 22rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.25rem, 3.5svh, 2rem);
    }

    /* Identity */
    .id { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .pfp {
      width: clamp(7rem, 17svh, 9.5rem);
      height: auto;
      aspect-ratio: 1;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }
    h1 {
      margin: 0.85rem 0 0;
      font-weight: 800;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .role, .lead, .pronouns { margin: 0; font-style: italic; line-height: 1.3; }
    .role { margin-top: 0.3rem; font-size: 1rem; }
    .lead { font-size: 0.85rem; opacity: 0.75; }
    .pronouns { margin-top: 0.3rem; font-size: 0.95rem; color: var(--pronoun); }

    /* Links */
    .links {
      list-style: none;
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 19.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .link {
      --fg: #fff;
      --bg: #1C1C1C;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      min-height: 3rem;
      padding: 0.5rem 1rem 0.5rem 0.75rem;
      border-radius: 8px;
      background: var(--bg);
      color: var(--fg);
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 120ms ease, filter 120ms ease;
    }
    .link:active { transform: scale(0.97); filter: brightness(1.25); }
    .link:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    @media (hover: hover) { .link:hover { filter: brightness(1.2); } }

    .icon { flex: none; width: 2rem; height: 2rem; display: grid; place-items: center; color: #fff; }
    .icon svg, .icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .icon--club img { transform: scale(1.5); }

    .link--discord { --fg: #738ADB; --bg: #1C2B5E; }
    .link--packet  { --fg: #0B8AD2; --bg: #0D2B4E; }
    .link--sso     { --fg: #C68AE8; --bg: #2D1A3E; }
    .link--help    { --fg: #D2990B; --bg: #1C1C1C; }
    .link--web     { --fg: #D2990B; --bg: #1C1C1C; }

    footer {
      padding-top: 1.25rem;
      text-align: center;
      font-weight: 100;
      font-style: italic;
      font-size: 0.7rem;
      color: #fff;
    }

    @media (max-height: 600px) {
      .links { gap: 0.5rem; }
      .link { min-height: 2.6rem; }
      h1 { margin-top: 0.6rem; font-size: 1.45rem; }
      footer { padding-top: 0.5rem; }
    }

    @media (prefers-reduced-motion: reduce) { .link { transition: none; } .link:active { transform: none; } }
  </style>
</head>
<body>
  <main>
    <header class="id">
      <img class="pfp" src="public/pfp-384.png" width="384" height="384" alt="Lily's avatar">
      <h1>Lily Ferreira</h1>
      <p class="role">Assistant Infrastructure Manager</p>
      <p class="lead">Black Team Assistant Lead</p>
      <p class="pronouns">She / Her</p>
    </header>

    <ul class="links">
      <li>
        <a class="link link--discord" href="https://discordapp.com/users/1360675875791831100" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M18.942 5.556a16.3 16.3 0 0 0-4.126-1.3a12 12 0 0 0-.529 1.1a15.2 15.2 0 0 0-4.573 0a12 12 0 0 0-.535-1.1a16.3 16.3 0 0 0-4.129 1.3a17.4 17.4 0 0 0-2.868 11.662a15.8 15.8 0 0 0 4.963 2.521q.616-.847 1.084-1.785a10.6 10.6 0 0 1-1.706-.83q.215-.16.418-.331a11.66 11.66 0 0 0 10.118 0q.206.172.418.331q-.817.492-1.71.832a12.6 12.6 0 0 0 1.084 1.785a16.5 16.5 0 0 0 5.064-2.595a17.3 17.3 0 0 0-2.973-11.59M8.678 14.813a1.94 1.94 0 0 1-1.8-2.045a1.93 1.93 0 0 1 1.8-2.047a1.92 1.92 0 0 1 1.8 2.047a1.93 1.93 0 0 1-1.8 2.045m6.644 0a1.94 1.94 0 0 1-1.8-2.045a1.93 1.93 0 0 1 1.8-2.047a1.92 1.92 0 0 1 1.8 2.047a1.93 1.93 0 0 1-1.8 2.045"/></svg>
          </span>
          My Discord
        </a>
      </li>
      <li>
        <a class="link link--packet" href="https://docs.google.com/document/d/1UoIUzikU8PzrNxN7YdaB2BD35kfBrQLrgFNYRcQJfbc/edit?tab=t.0" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true"><img src="public/plinktern-logo.svg" alt=""></span>
          Blue Team Packet
        </a>
      </li>
      <li>
        <a class="link link--sso" href="https://sso.plinko.horse/if/user/#/library" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 20 3m-3 3 3 3m-6 0 3 3"/></svg>
          </span>
          Plinko SSO
        </a>
      </li>
      <li>
        <a class="link link--help" href="https://help.hackucf.org/" target="_blank" rel="noopener noreferrer">
          <span class="icon icon--club" aria-hidden="true"><img src="public/club-logo.svg" alt=""></span>
          Hack@UCF OpenStack Help
        </a>
      </li>
      <li>
        <a class="link link--web" href="https://plinko.horse/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true"><img src="public/plink-logo.svg" alt=""></span>
          Horse Plinko Web
        </a>
      </li>
    </ul>
  </main>

  <footer>©2026 Blackbird-Technologies CC-BY-SA</footer>
</body>
</html>
