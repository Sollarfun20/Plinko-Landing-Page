<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Lily's Plinko Badge</title>
  <meta name="theme-color" content="#5BCEFA">
  <link rel="icon" href="/public/plink-logo.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: Metropolis; font-weight: 800; src: url("/public/fonts/metropolis-extrabold.otf") format("opentype"); }
    @font-face { font-family: Metropolis; font-weight: 700; src: url("/public/fonts/metropolis-bold.otf") format("opentype"); }
    *, *::before, *::after { box-sizing: border-box; }
    html { background: #F5A9B8; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem;
      font-family: Metropolis, "Helvetica Neue", Arial, sans-serif; color: #1A1A1A; text-align: center; padding: 1.5rem;
      background: linear-gradient(to bottom, #5BCEFA 0%, #FFFFFF 50%, #F5A9B8 75%);

    h1 { margin: 0; font-weight: 800; font-size: clamp(5rem, 30vw, 10rem); line-height: 1; letter-spacing: -0.04em; }
    p { margin: 0; }
    a { font-weight: 700; color: #D2990B; background: #1C1C1C; padding: 0.85rem 1.4rem; border-radius: 8px; text-decoration: none; }
